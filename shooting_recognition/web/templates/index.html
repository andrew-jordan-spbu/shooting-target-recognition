{% extends "base.html" %}
{% block title %}New Session{% endblock %}
{% block content %}
<div class="card">
  <h2>New Session</h2>
  <form action="/start" method="post" enctype="multipart/form-data">

    <div class="form-group">
      <label>Player Name</label>
      <input type="text" name="player_name" placeholder="Enter name" required>
    </div>

    <div class="form-group">
      <label>Video Source</label>
      <div class="radio-group">
        <label><input type="radio" name="source_type" value="usb" checked onchange="showSource('usb')"> USB Camera</label>
        <label><input type="radio" name="source_type" value="ip" onchange="showSource('ip')"> IP Camera (RTSP)</label>
        <label><input type="radio" name="source_type" value="file" onchange="showSource('file')"> Upload File</label>
      </div>
    </div>

    <div id="src-usb" class="source-opts">
      <label>Camera Index</label>
      <select name="camera_index">
        <option value="0">0 (default)</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>

    <div id="src-ip" class="source-opts hidden">
      <label>RTSP URL</label>
      <input type="text" name="rtsp_url"
             value="{{ default_rtsp_url }}"
             placeholder="rtsp://192.168.1.100/stream">
    </div>

    <div id="src-file" class="source-opts hidden">
      <label>Select video or photo</label>
      <input type="file" name="video_file" accept="video/*,image/jpeg,image/png">
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top:20px;width:100%">▶ Start Session</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
